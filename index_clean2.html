<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tank Wars - 5v5 Attack & Defend</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;user-select:none}
body{background:#0a0a1a;display:flex;justify-content:center;align-items:center;min-height:100vh;font-family:'Segoe UI','Roboto',Arial,sans-serif;overflow:hidden;color:#eee}
#wrap{position:relative;width:900px;height:600px;background:#111;border-radius:12px;overflow:hidden;box-shadow:0 0 60px rgba(245,166,35,.15),0 0 120px rgba(0,0,0,.8);border:1px solid #2a2a3e}
#hud{position:absolute;top:0;left:0;right:0;height:48px;background:linear-gradient(180deg,#1a1a2e 0%,#111122 100%);display:flex;align-items:center;justify-content:space-between;padding:0 16px;z-index:10;border-bottom:2px solid #2a2a3e;backdrop-filter:blur(10px)}
.hud-team{display:flex;align-items:center;gap:4px;font-weight:700;font-size:13px;text-transform:uppercase;letter-spacing:1px}
.hud-team.atk{color:#ff4757}
.hud-team.def{color:#3742fa}
.hud-team .icon{width:18px;height:18px;border-radius:3px;display:inline-block;margin-right:2px}
#atk-icons .icon,#def-icons .icon{width:14px;height:14px;border-radius:50%;display:inline-block;margin:0 1px;transition:all .3s}
#atk-icons .icon.alive{box-shadow:0 0 6px rgba(255,71,87,.6)}
#atk-icons .icon.dead{opacity:.25;background:#555!important}
#def-icons .icon.alive{box-shadow:0 0 6px rgba(55,66,250,.6)}
#def-icons .icon.dead{opacity:.25;background:#555!important}
#round-label{font-size:11px;color:#666;text-align:center;letter-spacing:1px}
#timer-box{font-size:26px;font-weight:900;color:#ffd32a;text-align:center;letter-spacing:2px;text-shadow:0 0 12px rgba(255,211,42,.4);font-variant-numeric:tabular-nums}
#timer-box.urgent{color:#ff4757;text-shadow:0 0 12px rgba(255,71,87,.6);animation:pulse 0.5s infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
#hud-pts{font-size:12px;color:#888;text-align:center}
canvas#c{position:absolute;top:48px;left:0;width:900px;height:452px;background:#2d5a1b;border:none;cursor:crosshair;image-rendering:pixelated}
#controls{position:absolute;bottom:0;left:0;right:0;height:90px;background:linear-gradient(0deg,rgba(0,0,0,.8) 0%,transparent 100%);display:flex;align-items:center;justify-content:space-between;padding:0 16px;z-index:10;pointer-events:none}
#dpad,#controls-right{display:flex;flex-direction:column;align-items:center;gap:4px;pointer-events:auto}
.dpad-btn{width:42px;height:42px;border-radius:10px;border:2px solid rgba(255,255,255,.15);background:rgba(255,255,255,.08);color:#fff;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s;backdrop-filter:blur(4px)}
.dpad-btn:hover,.dpad-btn:active{background:rgba(255,255,255,.2);border-color:rgba(255,255,255,.4);transform:scale(1.1)}
#dpad-row{display:flex;gap:4px}
#controls-right{flex-direction:row;gap:6px}
#controls-right button{padding:8px 12px;border-radius:8px;border:2px solid rgba(255,255,255,.15);background:rgba(255,255,255,.08);color:#fff;font-size:11px;font-weight:700;cursor:pointer;transition:all .15s;white-space:nowrap;backdrop-filter:blur(4px);letter-spacing:.5px}
#controls-right button:hover,#controls-right button:active{background:rgba(255,255,255,.2);transform:scale(1.05)}
#btn-fire{background:rgba(255,71,87,.2);border-color:rgba(255,71,87,.5)}
#btn-fire:hover,#btn-fire:active{background:rgba(255,71,87,.4)}
#weapon-select{position:absolute;top:52px;right:10px;z-index:15;display:none;flex-direction:column;gap:4px}
#weapon-select.show{display:flex}
.weapon-btn{padding:6px 12px;border-radius:6px;border:1px solid rgba(255,255,255,.2);background:rgba(0,0,0,.7);color:#ccc;font-size:11px;cursor:pointer;backdrop-filter:blur(4px);transition:all .2s}
.weapon-btn:hover{background:rgba(255,255,255,.15);color:#fff}
.weapon-btn.active{border-color:#ffd32a;color:#ffd32a}
#overlay{position:absolute;top:0;left:0;right:0;bottom:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(10,10,26,.85);backdrop-filter:blur(8px)}
#overlay.hidden{display:none}
#overlay h1{font-size:36px;font-weight:900;color:#ffd32a;text-shadow:0 0 20px rgba(245,166,35,.5);margin-bottom:8px;letter-spacing:2px}
#overlay .subtitle{font-size:14px;color:#888;margin-bottom:24px}
#overlay .mode-select{display:flex;gap:12px;margin-bottom:20px}
.mode-btn{padding:12px 24px;border-radius:8px;border:2px solid rgba(255,255,255,.15);background:rgba(255,255,255,.05);color:#eee;font-size:14px;font-weight:700;cursor:pointer;transition:all .2s;text-transform:uppercase;letter-spacing:1px}
.mode-btn:hover{background:rgba(245,166,35,.15);border-color:#f5a623;color:#f5a623}
.mode-btn.active{background:rgba(245,166,35,.2);border-color:#f5a623;color:#f5a623}
#start-btn{padding:14px 48px;border-radius:10px;border:2px solid #f5a623;background:linear-gradient(135deg,rgba(245,166,35,.2),rgba(245,166,35,.05));color:#f5a623;font-size:16px;font-weight:900;cursor:pointer;transition:all .2s;text-transform:uppercase;letter-spacing:2px;backdrop-filter:blur(4px)}
#start-btn:hover{background:linear-gradient(135deg,rgba(245,166,35,.4),rgba(245,166,35,.1));transform:scale(1.05);box-shadow:0 0 20px rgba(245,166,35,.3)}
#round-banner{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:18;pointer-events:none;display:none}
#round-banner.show{display:block;animation:bannerIn .6s ease-out}
#round-banner h2{font-size:48px;font-weight:900;color:#fff;text-shadow:0 0 30px rgba(255,255,255,.5);text-align:center;white-space:nowrap}
#round-banner .sub{font-size:18px;color:#ffd32a;text-align:center;margin-top:4px}
@keyframes bannerIn{0%{opacity:0;transform:translate(-50%,-50%) scale(1.5)}100%{opacity:1;transform:translate(-50%,-50%) scale(1)}}
#result-banner{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:18;pointer-events:none;display:none}
#result-banner.show{display:block;animation:bannerIn .6s ease-out}
#result-banner h2{font-size:42px;font-weight:900;text-shadow:0 0 30px rgba(255,255,255,.5);text-align:center}
#result-banner .sub{font-size:16px;color:#ccc;text-align:center;margin-top:6px}
#result-banner .stats{font-size:13px;color:#888;text-align:center;margin-top:10px}
</style>
</head>
<body>
<div id="wrap">
  <div id="hud">
    <div class="hud-team atk"><span class="icon" style="background:#ff4757"></span>ATK <span id="atk-icons"></span></div>
    <div><div id="round-label">ROUND 1 / 3</div><div id="timer-box">2:00</div><div id="hud-pts">ATK 0 - 0 DEF</div></div>
    <div class="hud-team def"><span id="def-icons"></span> DEF <span class="icon" style="background:#3742fa"></span></div>
  </div>
  <canvas id="c" width="900" height="452"></canvas>
  <div id="controls">
    <div id="dpad"><div id="dpad-row"><button class="dpad-btn" id="btn-left">◀</button><button class="dpad-btn" id="btn-up">▲</button><button class="dpad-btn" id="btn-down">▼</button><button class="dpad-btn" id="btn-right">▶</button></div></div>
    <div id="controls-right"><button id="btn-fire">🔥 FIRE</button><button id="btn-weapon">🔧 WEAPON</button><button id="btn-boost">⚡ BOOST</button></div>
  </div>
  <div id="weapon-select"></div>
  <div id="overlay"><h1>TANK WARS</h1><div class="subtitle">5 vs 5 · Attack & Defend</div><div class="mode-select"><button class="mode-btn active" id="mode-attack">⚔️ АТАКА</button><button class="mode-btn" id="mode-defend">🛡️ ЗАЩИТА</button></div><button id="start-btn">НАЧАТЬ МАТЧ</button></div>
  <div id="round-banner"><h2 id="rb-title"></h2><div class="sub" id="rb-sub"></div></div>
  <div id="result-banner"><h2 id="result-title"></h2><div class="sub" id="result-sub"></div><div class="stats" id="result-stats"></div></div>
</div>
<script src="game.js"></script>
</body>
</html>
